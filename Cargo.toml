[package]
name = "sqlser"
authors = ["Drew Ripberger <aripberg@cs.cmu.edu>"]
version = "0.1.0"
edition = "2024"
description = "Sound LogicalPlan -> SQL serialization for DataFusion"

[dependencies]
datafusion = { version = "^55", features = ["sql"] }
sqlparser = { version = "0.62", features = ["std", "visitor"] }
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
async-trait = "0.1.89"
